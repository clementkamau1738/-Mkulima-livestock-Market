# Render Blueprint: FREE DEMO deployment (README "Deploying to Render").
# One free web service (Django serving the API and the React app, built from
# Dockerfile.render) and one free PostgreSQL database. Every push to main
# redeploys.
#
# Free plan limits: the service sleeps after 15 idle minutes (about a minute
# to wake), and the free database is DELETED 30 days after creation, with
# every account and request in it. Not for real customers or real money.
#
# Values marked `sync: false` are asked for once, when the Blueprint is
# created; change them later under the service's Environment tab.

databases:
  - name: mkulima-db
    plan: free
    region: frankfurt
    databaseName: mkulima
    user: mkulima
    postgresMajorVersion: "17"

services:
  - type: web
    name: mkulima-livestock-market
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mkulima-db
          property: connectionString
      # At least 50 random characters:
      #   python3 -c "import secrets; print(secrets.token_urlsafe(50))"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "False"
      # The onrender.com host name is added automatically; localhost is for
      # Render's port detector. Add custom domains here, comma separated.
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost
      - key: PORT
        value: "10000"
      # Render terminates HTTPS and sets X-Forwarded-Proto.
      - key: DJANGO_TRUST_X_FORWARDED_PROTO
        value: "True"
      # Client IP for rate limits: second-to-last X-Forwarded-For entry.
      # Not confirmed in Render's docs; check it after the first deploy.
      - key: DJANGO_NUM_PROXIES
        value: "2"
      # Low until HTTPS is proven on the final domain.
      - key: DJANGO_HSTS_SECONDS
        value: "300"
      # Loads the fictional sample listings into an empty database only.
      - key: SEED_SAMPLE_DATA
        value: "True"
      # First administrator, created once if no account has this email.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Photos: S3-compatible bucket (free services have no persistent disk).
      - key: MEDIA_STORAGE
        value: s3
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # e.g. https://<account-id>.r2.cloudflarestorage.com (empty for AWS)
      - key: S3_ENDPOINT_URL
        sync: false
      # "auto" for Cloudflare R2, else the bucket's region
      - key: S3_REGION_NAME
        sync: false
      # Public host the photos are served from, e.g. pub-xxxx.r2.dev; also
      # allowed in the site's Content-Security-Policy.
      - key: S3_CUSTOM_DOMAIN
        sync: false
